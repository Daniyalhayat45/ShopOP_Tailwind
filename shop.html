<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopOP | Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">

    <!-- Navbar -->
    <header class="bg-white border-b">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-bold text-green-600">
                ShopOP
            </a>

            <nav class="flex gap-6">
                <a href="index.html" class="hover:text-green-600">Home</a>
                <a href="shop.html" class="text-green-600 font-semibold">Shop</a>
                <a href="contact.html" class="hover:text-green-600">Contact</a>
                <a href="product.html" class="hover:text-green-600">Product</a>
                <a href="cart.html" class="hover:text-green-600">Cart</a>
            </nav>
        </div>
    </header>

    <!-- Heading -->
    <section class="max-w-7xl mx-auto px-6 pt-16 pb-10 text-center">
        <p class="text-green-600 uppercase tracking-widest font-semibold">
            Our Store
        </p>

        <h1 class="text-5xl font-bold mt-3">
            Shop Products
        </h1>

        <p class="text-gray-500 mt-4">
            Find something you love.
        </p>
    </section>

    <!-- Products -->
    <section class="max-w-7xl mx-auto px-6 pb-20">

         <div id="products" class="grid md:grid-cols-3 gap-8">
    </div>
      
    </section>

    <footer class="bg-gray-900 text-white py-8 text-center">
        <p class="font-bold text-xl">ShopOP</p>
        <p class="text-gray-400 mt-2">Shop Smart. Shop Easy.</p>
    </footer>

</body>

<script>

async function loadProducts() {

    const container = document.getElementById('products');

    try {

        const response = await fetch(
            'https://muhammadfarhandeveloper.github.io/E-Commerce-fakeapi/products.json'
        );

        const products = await response.json();

        products.forEach(product => {

            container.innerHTML += `
                <div class="bg-white rounded-2xl shadow-sm border p-5">

                    <div class="h-56 bg-gray-100 rounded-xl flex items-center justify-center">
                        <img src="${product.image}" 
                             alt="${product.name}"
                             class="max-h-full max-w-full object-contain">
                    </div>

                    <h3 class="text-xl font-bold mt-5">
                        ${product.name}
                    </h3>

                    <p class="text-gray-500 mt-2">
                        ${product.category}
                    </p>

                    <p class="text-xl font-bold mt-4">
                        Rs. ${product.price}
                    </p>

                    <a href="product.html"
                       class="block text-center bg-green-600 text-white py-3 rounded-lg mt-5 hover:bg-green-700">
                        View Product
                    </a>

                </div>
            `;

        });

    } catch (error) {

        container.innerHTML = `
            <p class="text-red-500">
                Unable to load products.
            </p>
        `;

        console.error(error);
    }

}

loadProducts();

</script>
</html>
