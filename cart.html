<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopOP | Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">

    <!-- Navbar -->
    <header class="bg-white border-b">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-bold text-green-600">
                ShopOP
            </a>

            <nav class="flex gap-6">
                <a href="index.html" class="hover:text-green-600">Home</a>
                <a href="shop.html" class="hover:text-green-600">Shop</a>
                <a href="product.html" class="hover:text-green-600">Product</a>
                <a href="cart.html" class="text-green-600 font-semibold">Cart</a>
            </nav>
        </div>
    </header>

    <!-- Cart -->
    <main class="max-w-5xl mx-auto px-6 py-20">

        <div class="text-center mb-12">

            <p class="text-green-600 uppercase tracking-widest font-semibold">
                Shopping Cart
            </p>

            <h1 class="text-5xl font-bold mt-3">
                Your Cart
            </h1>

        </div>

        <div class="grid md:grid-cols-3 gap-8">

            <!-- Items -->
            <div class="md:col-span-2 space-y-5">

                <!-- Item -->
                <div class="bg-white border rounded-2xl p-5 flex items-center gap-5">

                    <div class="w-24 h-24 bg-gray-100 rounded-xl flex items-center justify-center text-4xl">
                        🎧
                    </div>

                    <div class="flex-1">
                        <h2 class="font-bold text-lg">
                            Wireless Headphones
                        </h2>

                        <p class="text-gray-500">
                            Quantity: 1
                        </p>

                        <p class="font-bold mt-2">
                            Rs. 4,999
                        </p>
                    </div>

                    <button class="text-red-500 font-semibold">
                        Remove
                    </button>

                </div>

                <!-- Item -->
                <div class="bg-white border rounded-2xl p-5 flex items-center gap-5">

                    <div class="w-24 h-24 bg-gray-100 rounded-xl flex items-center justify-center text-4xl">
                        🎒
                    </div>

                    <div class="flex-1">
                        <h2 class="font-bold text-lg">
                            Classic Backpack
                        </h2>

                        <p class="text-gray-500">
                            Quantity: 1
                        </p>

                        <p class="font-bold mt-2">
                            Rs. 2,999
                        </p>
                    </div>

                    <button class="text-red-500 font-semibold">
                        Remove
                    </button>

                </div>

            </div>

            <!-- Summary -->
            <div class="bg-white border rounded-2xl p-6 h-fit">

                <h2 class="text-2xl font-bold">
                    Order Summary
                </h2>

                <div class="flex justify-between mt-6">
                    <span class="text-gray-500">
                        Subtotal
                    </span>

                    <span class="font-semibold">
                        Rs. 7,998
                    </span>
                </div>

                <div class="flex justify-between mt-4">
                    <span class="text-gray-500">
                        Delivery
                    </span>

                    <span class="font-semibold">
                        Rs. 200
                    </span>
                </div>

                <div class="border-t mt-6 pt-6 flex justify-between">
                    <span class="font-bold text-lg">
                        Total
                    </span>

                    <span class="font-bold text-lg">
                        Rs. 8,198
                    </span>
                </div>

                <button
                    class="w-full bg-green-600 text-white py-4 rounded-lg font-bold mt-7 hover:bg-green-700">
                    Checkout
                </button>

            </div>

        </div>

    </main>

    <footer class="bg-gray-900 text-white py-8 text-center">
        <p class="font-bold text-xl">ShopOP</p>
        <p class="text-gray-400 mt-2">Shop Smart. Shop Easy.</p>
    </footer>

</body>
</html>
