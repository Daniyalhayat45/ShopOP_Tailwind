<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
 <div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <!-- Card Container -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 space-y-6">
    
    <!-- Header -->
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Welcome back</h1>
      <p class="text-sm text-gray-500">Please enter your details to sign in</p>
    </div>

    <!-- Form -->
    <form class="space-y-4" onsubmit="event.preventDefault();">
      <!-- Email Field -->
      <div class="space-y-1">
        <label for="email" class="text-sm font-medium text-gray-700 block">Email Address</label>
        <input 
          type="email" 
          id="email" 
          placeholder="you@example.com" 
          class="w-full px-4 py-3 rounded-lg border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition duration-200"
          required
        />
      </div>

      <!-- Password Field -->
      <div class="space-y-1">
        <label for="password" class="text-sm font-medium text-gray-700 block">Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="••••••••" 
          class="w-full px-4 py-3 rounded-lg border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition duration-200"
          required
        />
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center space-x-2 cursor-pointer select-none text-gray-600">
          <input type="checkbox" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-gray-300" />
          <span>Remember me</span>
        </label>
        <a href="home.html
        " class="font-medium text-indigo-600 hover:text-indigo-500 transition duration-150">Forgot password?</a>
      </div>

      <!-- Sign In Button -->
      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
      >
        Sign In
      </button>
    </form>

    <!-- Sign Up Link -->
    <p class="text-center text-sm text-gray-600">
      Don't have an account? 
      <a href="contact.html" class="font-medium text-indigo-600 hover:text-indigo-500 transition duration-150">Sign up</a>
    </p>

  </div>
</div>


</body>
</html>
